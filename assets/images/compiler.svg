    </g>
    <style>
    .code {
        display: flex;
        align-items: flex-end;
        height: 100%;
        color: #9c9c9c;
        font-family: monospace;
        font-size: 11px;
        line-height: 1.2;
        overflow: hidden;
        white-space: pre;
    }
    @keyframes fadeout {
        50% { color: #9c9c9c; translate: none; filter: blur(0); }
        100% { color: #060708; translate: 50px 0; filter: blur(3px); }
    }
    </style>
    <script><![CDATA[
window.addEventListener("load", () => {
  function type(elem) {
    let text = elem.innerText;
    elem.innerText = "";
    let newLine = true;
    let lines = [];
    let offset = 0;
    function append() {
      if (newLine) {
        let div = document.createElement("div");
        elem.appendChild(div);
        lines.push(div);
        newLine = false;
      }
      let char;
      do {
        char = text.charAt(offset++);
        let line = lines[lines.length - 1];
        line.innerHTML += char;
      } while (char == " ");
      elem.parentElement.scrollTop = 9000;
      if (char == "\n") newLine = true;
      if (offset == text.length) {
        offset = 0;
        elem.style.animation = "fadeout 2s forwards ease-in";
        setTimeout(() => {
          lines.forEach(line => {
            elem.removeChild(line);
          });
          elem.style.animation = "";
          lines = [];
          newLine = true;
          setTimeout(append, 250);
        }, 2000);
      } else {
        setTimeout(append, 80);
      }
    }
    append();
  }
  type(document.querySelector("#cell-source div div"));
  type(document.querySelector("#cell-wat div div"));
  type(document.querySelector("#cell-wasm div div"));
});
]]></script>
</svg>
