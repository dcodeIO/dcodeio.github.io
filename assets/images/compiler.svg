        <path d="M415 40q45-40 80-35t51.2 45.5" fill="none" pointer-events="stroke"/>
        <path d="m549.17 57.92-6.69-5.94 7.43-2.97Z" fill="#9c9c9c" pointer-events="all"/>
    </g>
    <g data-label="source" transform="translate(-0.5 -0.5)">
        <path fill="none" pointer-events="all" d="M20.5 50H190v160H20.5z"/>
        <foreignObject id="cell-source" pointer-events="none" x="23" y="51" width="168" height="156" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility" style="overflow:visible;text-align:left">
            <div xmlns="http://www.w3.org/1999/xhtml" class="code">
                <div>export function fib(n: i32): i32 {
  var a = 0, b = 1
  if (n &gt; 0) {
    while (--n) {
      let t = a + b
      a = b
      b = t
    }
    return b
  }
  return a
}</div>
            </div>
        </foreignObject>
    </g>
    <g data-label="wat" transform="translate(-0.5 -0.5)">
        <path fill="none" pointer-events="all" d="M201 70h169v160H201z"/>
        <foreignObject id="cell-wat" pointer-events="none" x="203" y="71" width="167" height="156" requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility" style="overflow: visible">
            <div xmlns="http://www.w3.org/1999/xhtml" class="code">
                <div>(module
 (export "fib"
  (func $module/fib (param $n i32) (result i32)
   (local $a i32)
   (local $b i32)
   (local $t i32)
   i32.const 1
   local.set $a
   local.get $n
   i32.const 0
   i32.gt_s
   if
    loop $while-continue
     local.get $n
     i32.const 1
     i32.sub
     local.tee $n
     if
      local.get $a
      local.get $b
      i32.add
      local.set $t
      local.get $a
      local.set $b
      local.get $t
      local.set $a
      br $while-continue
     end
    end
    local.get $a
    return
   end
   i32.const 0
  )
 )
)</div>
            </div>
        </foreignObject>
    </g>
    <g data-label="wasm" transform="translate(-0.5 -0.5)">
        <path fill="none" pointer-events="all" d="M381 90h279v160H381z"/>
